// Optional: add these lines to the end of librewolf.overrides.cfg to let websites see dark mode.
// Trade-off: replaces LibreWolf's full anti-fingerprinting (RFP) with Firefox's FPP with all
// protections on except the colour scheme (recipe from the LibreWolf FAQ). LibreWolf advises against it.
// Let websites see dark mode, keep every other fingerprinting protection (recipe from the
// LibreWolf FAQ): switch from RFP (no exceptions possible) to FPP with all protections on
// except the colour scheme. LibreWolf advises against changing RFP; the user chose this.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
