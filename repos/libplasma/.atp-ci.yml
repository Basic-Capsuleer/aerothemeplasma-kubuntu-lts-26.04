image: "archlinux:latest"

stages:
  - build

build-linux-x64:
  stage: build
  before_script:
    - pacman-key --init
    - pacman -Syu --needed --noconfirm ninja cmake gcc gcc-libs glibc plasma-activities kcolorscheme kconfig kcoreaddons kglobalaccel kguiaddons ki18n kiconthemes kio kirigami knotifications kpackage ksvg kwidgetsaddons kwindowsystem libglvnd libx11 libxcb qt6-5compat qt6-base qt6-declarative wayland qt6-wayland extra-cmake-modules kdoctools plasma-wayland-protocols
    - ln -s /usr/share/wayland/wayland.xml /wayland.xml # Ugly hack to make the xml file visible to cmake during the build process
  script:
    - cmake -G Ninja -DBUILD_TESTING=ON -B build . 
    - cmake --build build 
    - DESTDIR=out cmake --install build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 6 mos
    paths: 
      - out/

